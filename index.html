<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belno Plush Clicker</title>
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        .material-symbols-outlined {
            font-size: 20px;
            vertical-align: middle;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #222;
            user-select: none;
            touch-action: none;
            font-family: 'Fredoka', cursive, sans-serif;
        }

        .bg-blur {
            position: fixed;
            top: -20px;
            left: -20px;
            width: calc(100% + 40px);
            height: calc(100% + 40px);
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(5px);
            z-index: 0;
            pointer-events: none;
        }

        canvas {
            display: block;
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
        }

        .button-container {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            z-index: 9999;
            pointer-events: none;
        }

        .control-btn {
            pointer-events: auto;
            background-color: #ff4757;
            color: white;
            border: none;
            padding: clamp(8px, 1.5vw, 12px) clamp(12px, 2vw, 22px);
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: clamp(13px, 1.8vw, 17px);
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s, background 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-btn:hover {
            background-color: #ff6b81;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
        }

        .icon-btn {
            padding: clamp(8px, 1.5vw, 12px) clamp(10px, 1.8vw, 14px);
            background-color: #57606f;
        }

        .icon-btn:hover {
            background-color: #747d8c;
        }

        .icon-btn img {
            width: clamp(18px, 2.5vw, 22px);
            height: clamp(18px, 2.5vw, 22px);
            object-fit: contain;
            display: block;
        }

        .eaten-counter {
            background-color: #57606f;
            color: white;
            cursor: pointer;
            gap: 6px;
        }

        .eaten-counter:hover {
            background-color: #747d8c;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .eaten-counter:active {
            transform: scale(0.95);
        }

        .eaten-counter img {
            width: clamp(18px, 2.5vw, 22px);
            height: clamp(18px, 2.5vw, 22px);
            object-fit: contain;
            display: block;
        }

        .explode-btn {
            background-color: #ffa502;
        }

        .explode-btn:hover {
            background-color: #eccc68;
        }

        .control-btn.active {
            background-color: #2ed573;
        }

        .control-btn.active:hover {
            background-color: #7bed9f;
        }

        .watermark {
            position: fixed;
            bottom: 15px;
            left: 15px;
            color: rgba(255, 255, 255, 0.45);
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: clamp(18px, 2.5vw, 26px);
            font-weight: 700;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .watermark img {
            width: clamp(22px, 3vw, 30px);
            height: clamp(22px, 3vw, 30px);
            opacity: 0.6;
            object-fit: contain;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            z-index: 10000;
            pointer-events: none;
        }

        .modal-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #57606f;
            border: none;
            border-radius: 12px;
            padding: 16px;
            width: 280px;
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            touch-action: none;
            pointer-events: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 700;
            cursor: move;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: #ced6e0;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .modal-close:hover {
            color: #fff;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field-label {
            font-size: 12px;
            color: #ced6e0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .info-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .info-icon {
            font-size: 14px;
            color: #ced6e0;
            cursor: pointer;
        }

        .info-icon:hover {
            color: #fff;
        }

        .info-bubble {
            display: none;
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background: #2f3542;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 8px;
            width: 170px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            pointer-events: none;
            z-index: 10001;
        }

        .info-bubble::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: #2f3542 transparent transparent transparent;
        }

        .info-wrapper:hover .info-bubble,
        .info-wrapper.active .info-bubble {
            display: block;
        }

        .input-wrapper {
            display: flex;
            background: #2f3542;
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            align-items: center;
            gap: 4px;
        }

        .input-wrapper input {
            background: transparent;
            border: none;
            color: #2ed573;
            font-family: monospace;
            font-size: 11px;
            width: 100%;
            outline: none;
        }

        .input-wrapper button {
            background: transparent;
            border: none;
            color: #a4b0be;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0;
            transition: color 0.2s;
        }

        .input-wrapper button:hover {
            color: #fff;
        }

        .text-input {
            background: #2f3542;
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            color: #fff;
            font-family: monospace;
            font-size: 11px;
            outline: none;
        }

        .save-btn {
            background: #2ed573;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 9px;
            font-family: inherit;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }

        .save-btn:hover {
            background: #26af5f;
        }

        @media (max-width: 480px) {
            .button-container {
                top: 10px;
                left: 10px;
                right: 10px;
                gap: 6px;
            }
            .watermark {
                bottom: 10px;
                left: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-blur"></div>

    <div class="button-container">
        <button id="auto-btn" class="control-btn">Auto Drop: OFF</button>
        <button id="remove-btn" class="control-btn">Remove All</button>
        <button id="explode-btn" class="control-btn explode-btn">Explode!</button>
        <button id="drag-btn" class="control-btn icon-btn" title="Toggle Dragging">
            <span class="material-symbols-outlined">drag_pan</span>
        </button>
        <button id="custom-btn" class="control-btn icon-btn" title="Remove Oguris Only">
            <img src="images/custom_icon.png" alt="icon">
        </button>
        <button id="cookie-btn" class="control-btn icon-btn" title="Cookie Settings">
            <span class="material-symbols-outlined">cookie</span>
        </button>
        <div id="eaten-counter" class="control-btn eaten-counter" title="Total Eaten">
            <img src="images/iconfork.png" alt="icon">
            <span id="eaten-count">0</span>
        </div>
    </div>

    <!-- Save Data Modal -->
    <div id="cookie-modal" class="modal-overlay">
        <div class="modal-card" id="modal-card">
            <div class="modal-header" id="modal-header">
                <span>Save Data</span>
                <button id="close-modal-btn" class="modal-close">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            
            <div class="field-group">
                <span class="field-label">
                    Current Cookie
                    <span class="info-wrapper" id="cookie-info-wrapper">
                        <span class="material-symbols-outlined info-icon">info</span>
                        <span class="info-bubble">do not share this cookie unless you wanna share your eaten progress...</span>
                    </span>
                </span>
                <div class="input-wrapper">
                    <input type="password" id="cookie-val-input" readonly value="">
                    <button id="copy-cookie-btn" type="button" title="Copy Cookie">
                        <span class="material-symbols-outlined" id="copy-icon">content_copy</span>
                    </button>
                    <button id="toggle-eye-btn" type="button" title="Toggle Visibility">
                        <span class="material-symbols-outlined" id="eye-icon">visibility_off</span>
                    </button>
                </div>
            </div>

            <div class="field-group">
                <span class="field-label">Paste Cookie Data</span>
                <input type="text" id="paste-cookie-input" class="text-input" placeholder="Paste cookie data...">
            </div>

            <button id="load-cookie-btn" class="save-btn" type="button">Load Save</button>
        </div>
    </div>

    <div class="watermark">
        <img src="images/icon.png" alt="icon">
        <span>belno.blinkle.fun</span>
    </div>

    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/`;
        }

        /* Portable Base64 Encoder / Decoder for Cross-Browser Compatibility */
        function encodeScore(score) {
            const salt = Math.random().toString(36).substring(2, 7);
            const rawPayload = `${salt}|${score}|${Date.now()}`;
            const b64Data = btoa(rawPayload);
            return `blinkle_(${salt}-${b64Data})`;
        }

        function universalDecode(str) {
            if (!str || typeof str !== 'string') return null;

            let cleanStr = str.trim();

            const match = cleanStr.match(/^blinkle_\((.*)\)$/i);
            if (match) cleanStr = match[1];

            const dashParts = cleanStr.split('-');
            const dataPart = dashParts.length === 2 ? dashParts[1] : dashParts[0];

            let decodedRaw = null;
            try {
                decodedRaw = atob(dataPart);
            } catch (e) {
                // Not standard base64
            }

            if (decodedRaw) {
                // Check salt|score|timestamp format
                if (decodedRaw.includes('|')) {
                    const parts = decodedRaw.split('|');
                    const score = parseInt(parts[1], 10);
                    if (!isNaN(score) && score >= 0) return score;
                }

                // Direct number inside base64
                const directNum = parseInt(decodedRaw, 10);
                if (!isNaN(directNum) && directNum >= 0) return directNum;
            }

            // Fallback: Extract pure numerical value
            const fallbackNum = parseInt(cleanStr.replace(/[^0-9]/g, ''), 10);
            return !isNaN(fallbackNum) ? fallbackNum : null;
        }

        /* Load and parse initial score */
        let rawCookieVal = getCookie('eatenCountData') || getCookie('eatenCount');
        let totalEaten = 0;

        if (rawCookieVal) {
            let parsed = universalDecode(rawCookieVal);
            totalEaten = parsed !== null ? parsed : 0;
        }

        const eatenCountEl = document.getElementById('eaten-count');
        const eatenCounterBtn = document.getElementById('eaten-counter');
        
        let isHovered = false;
        let isToggledMobile = false;

        function formatNumber(num) {
            if (num >= 1e12) return (num / 1e12).toFixed(1).replace(/\.0$/, '') + 'T';
            if (num >= 1e9) return (num / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
            return num.toString();
        }

        function updateCounterUI() {
            if (isHovered || isToggledMobile) {
                eatenCountEl.textContent = totalEaten.toLocaleString();
            } else {
                eatenCountEl.textContent = formatNumber(totalEaten);
            }
            eatenCounterBtn.title = `Total Eaten: ${totalEaten.toLocaleString()}`;
        }

        eatenCounterBtn.addEventListener('mouseenter', () => {
            isHovered = true;
            updateCounterUI();
        });

        eatenCounterBtn.addEventListener('mouseleave', () => {
            isHovered = false;
            updateCounterUI();
        });

        eatenCounterBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isToggledMobile = !isToggledMobile;
            updateCounterUI();
        });
        
        updateCounterUI();

        function incrementEatenCounter() {
            totalEaten++;
            updateCounterUI();
            setCookie('eatenCountData', encodeScore(totalEaten));
        }

        /* Cookie Modal Logic */
        const cookieBtn = document.getElementById('cookie-btn');
        const cookieModal = document.getElementById('cookie-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const cookieValInput = document.getElementById('cookie-val-input');
        const toggleEyeBtn = document.getElementById('toggle-eye-btn');
        const copyCookieBtn = document.getElementById('copy-cookie-btn');
        const copyIcon = document.getElementById('copy-icon');
        const eyeIcon = document.getElementById('eye-icon');
        const pasteCookieInput = document.getElementById('paste-cookie-input');
        const loadCookieBtn = document.getElementById('load-cookie-btn');
        const cookieInfoWrapper = document.getElementById('cookie-info-wrapper');

        const modalCard = document.getElementById('modal-card');
        let isDragging = false;
        let offsetX = 0, offsetY = 0;

        cookieInfoWrapper.addEventListener('click', (e) => {
            e.stopPropagation();
            cookieInfoWrapper.classList.toggle('active');
        });

        document.addEventListener('click', () => {
            cookieInfoWrapper.classList.remove('active');
        });

        modalCard.addEventListener('pointerdown', (e) => {
            if (e.target.closest('input, button, .info-wrapper')) return;
            isDragging = true;
            const rect = modalCard.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            modalCard.style.transform = 'none';
            modalCard.style.left = `${rect.left}px`;
            modalCard.style.top = `${rect.top}px`;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            
            const cardWidth = modalCard.offsetWidth;
            const cardHeight = modalCard.offsetHeight;
            
            let newX = e.clientX - offsetX;
            let newY = e.clientY - offsetY;

            newX = Math.max(0, Math.min(window.innerWidth - cardWidth, newX));
            newY = Math.max(0, Math.min(window.innerHeight - cardHeight, newY));

            modalCard.style.left = `${newX}px`;
            modalCard.style.top = `${newY}px`;
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
        });

        cookieBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            cookieValInput.value = encodeScore(totalEaten);
            modalCard.style.left = '50%';
            modalCard.style.top = '50%';
            modalCard.style.transform = 'translate(-50%, -50%)';
            cookieModal.style.display = 'block';
        });

        closeModalBtn.addEventListener('click', () => {
            cookieModal.style.display = 'none';
        });

        toggleEyeBtn.addEventListener('click', () => {
            const isHidden = cookieValInput.type === 'password';
            cookieValInput.type = isHidden ? 'text' : 'password';
            eyeIcon.textContent = isHidden ? 'visibility' : 'visibility_off';
        });

        copyCookieBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(cookieValInput.value).then(() => {
                copyIcon.textContent = 'check';
                copyIcon.style.color = '#2ed573';
                setTimeout(() => {
                    copyIcon.textContent = 'content_copy';
                    copyIcon.style.color = '';
                }, 1500);
            }).catch(() => {
                cookieValInput.type = 'text';
                cookieValInput.select();
                document.execCommand('copy');
                cookieValInput.type = 'password';
                copyIcon.textContent = 'check';
                copyIcon.style.color = '#2ed573';
                setTimeout(() => {
                    copyIcon.textContent = 'content_copy';
                    copyIcon.style.color = '';
                }, 1500);
            });
        });

        loadCookieBtn.addEventListener('click', () => {
            const inputVal = pasteCookieInput.value.trim();
            if (!inputVal) {
                alert('Please paste a cookie string first!');
                return;
            }

            const decodedScore = universalDecode(inputVal);

            if (decodedScore !== null && !isNaN(decodedScore) && decodedScore >= 0) {
                totalEaten = decodedScore;
                setCookie('eatenCountData', encodeScore(totalEaten));
                updateCounterUI();
                cookieValInput.value = encodeScore(totalEaten);
                pasteCookieInput.value = '';
                cookieModal.style.display = 'none';
            } else {
                alert('Invalid Cookie String!');
            }
        });

        /* Physics Engine Setup */
        const { Engine, Render, Runner, Bodies, Composite, Mouse, MouseConstraint, Events, Body, Query } = Matter;

        const engine = Engine.create();
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                pixelRatio: pixelRatio,
                wireframes: false,
                background: 'transparent'
            }
        });

        Render.run(render);

        const runner = Runner.create();
        Runner.run(runner, engine);

        const wallOptions = { isStatic: true, render: { visible: false } };
        
        let floor = Bodies.rectangle(window.innerWidth / 2, window.innerHeight + 30, window.innerWidth * 2, 100, wallOptions);
        let leftWall = Bodies.rectangle(-30, window.innerHeight / 2, 100, window.innerHeight * 2, wallOptions);
        let rightWall = Bodies.rectangle(window.innerWidth + 30, window.innerHeight / 2, 100, window.innerHeight * 2, wallOptions);
        let ceiling = Bodies.rectangle(window.innerWidth / 2, -30, window.innerWidth * 2, 100, wallOptions);

        Composite.add(engine.world, [floor, leftWall, rightWall, ceiling]);

        const mouse = Mouse.create(render.canvas);
        mouse.pixelRatio = pixelRatio;

        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: {
                stiffness: 0.2,
                render: { visible: false }
            }
        });

        mouseConstraint.collisionFilter.mask = 0;
        Composite.add(engine.world, mouseConstraint);
        render.mouse = mouse;

        let plushBodies = [];
        let poppingBodies = [];
        let particles = [];
        let floatingTexts = [];

        let autoDropInterval = null;
        let dragEnabled = false;

        const sfxSpawn = new Audio('sfx/sfx.mp3');
        sfxSpawn.preload = 'auto';

        const POOL_SIZE = 15;
        const sfxEatPool = [];
        let poolIndex = 0;

        for (let i = 0; i < POOL_SIZE; i++) {
            const sound = new Audio('sfx/sfx2.mp3');
            sound.preload = 'auto';
            sfxEatPool.push(sound);
        }

        function playSpawnSFX() {
            sfxSpawn.currentTime = 0;
            sfxSpawn.volume = 0.5;
            sfxSpawn.play().catch(() => {});
        }

        function playEatSFX() {
            const audio = sfxEatPool[poolIndex];
            poolIndex = (poolIndex + 1) % POOL_SIZE;

            audio.currentTime = 0;
            audio.volume = 0.5;
            audio.play().catch(() => {});
        }

        function getResponsivePlushSize() {
            const minDimension = Math.min(window.innerWidth, window.innerHeight);
            return Math.max(45, Math.min(80, minDimension * 0.12));
        }

        function spawnPlush(x, y, playSound = true, isManual = false, forceOguri = false) {
            const plushSize = getResponsivePlushSize();
            const plushWidth = plushSize;
            const plushHeight = plushSize;

            const rand = Math.random();
            let isEater = false;
            let isOguri = false;
            let texture = 'images/plush.png';

            if (forceOguri || (isManual && rand < 0.006)) {
                isEater = true;
                isOguri = true;
                texture = 'images/oguri.png';
            } else {
                isEater = false;
                isOguri = false;
                texture = 'images/plush.png';
            }

            const plush = Bodies.rectangle(x, y, plushWidth, plushHeight, {
                chamfer: { radius: plushSize * 0.2 },
                restitution: 0.65,
                friction: 0.05,
                frictionStatic: 0.02,
                render: {
                    sprite: {
                        texture: texture,
                        xScale: plushWidth / 100,
                        yScale: plushHeight / 100
                    }
                }
            });

            plush.isEater = isEater;
            plush.isOguri = isOguri;
            plush.eatCount = 0;
            plush.eatCooldown = 0;
            plush.isEaten = false;

            Body.setAngularVelocity(plush, (Math.random() - 0.5) * 0.2);
            Body.setVelocity(plush, {
                x: (Math.random() - 0.5) * 2,
                y: -1 - Math.random() * 2
            });

            Composite.add(engine.world, plush);
            plushBodies.push(plush);

            if (isOguri) {
                plushBodies.forEach(b => {
                    if (!b.isOguri) {
                        const dx = b.position.x - x;
                        const dir = dx >= 0 ? 1 : -1;

                        Body.setVelocity(b, {
                            x: dir * (3 + Math.random() * 3),
                            y: -4 - Math.random() * 2
                        });
                        Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.4);
                    }
                });
            }

            if (playSound) playSpawnSFX();
        }

        window.spawnOguri = function(count = 1) {
            for (let i = 0; i < count; i++) {
                const rx = Math.random() * (window.innerWidth - 160) + 80;
                const ry = 80 + Math.random() * 50;
                spawnPlush(rx, ry, true, false, true);
            }
        };

        function createPopParticles(x, y, count = 8) {
            const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#ffffff'];
            const scaleFactor = getResponsivePlushSize() / 80;

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (2 + Math.random() * 4) * scaleFactor;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: (3 + Math.random() * 4) * scaleFactor,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1.0
                });
            }
        }

        function spawnFunnyText(x, y, customWord = null) {
            const words = ["NOM!", "CRUNCH!", "SLURP!", "DELICIOUS!", "GIMME!", "BURP!", "MINE!"];
            const word = customWord || words[Math.floor(Math.random() * words.length)];
            floatingTexts.push({
                x: x,
                y: y,
                text: word,
                life: 1.0,
                vy: -1.5 - Math.random() * 1.5,
                rotation: (Math.random() - 0.5) * 0.2
            });
        }

        function eatPlush(eater, food) {
            if (food.isOguri || food.isEaten) return;

            food.isEaten = true;

            const index = plushBodies.indexOf(food);
            if (index === -1) return;

            eater.eatCount++;
            eater.eatCooldown = Date.now() + 250;

            incrementEatenCounter();

            createPopParticles(food.position.x, food.position.y);
            spawnFunnyText(food.position.x, food.position.y);
            playEatSFX();

            if (mouseConstraint.body === food) {
                mouseConstraint.constraint.body = null;
            }

            Composite.remove(engine.world, food);
            plushBodies.splice(index, 1);

            if (mouseConstraint.body !== eater) {
                Body.setVelocity(eater, {
                    x: eater.velocity.x * 0.5,
                    y: -6.5
                });
                Body.setAngularVelocity(eater, (Math.random() - 0.5) * 0.2);
            }

            plushBodies.forEach(b => {
                if (!b.isOguri && !b.isEaten) {
                    const dx = b.position.x - eater.position.x;
                    const dy = b.position.y - eater.position.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < 250) {
                        const dirX = dx >= 0 ? 1 : -1;
                        Body.setVelocity(b, {
                            x: dirX * (3 + Math.random() * 2),
                            y: -3 - Math.random() * 2
                        });
                        Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.3);
                    }
                }
            });
        }

        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach(pair => {
                const { bodyA, bodyB } = pair;
                let eater = null;
                let food = null;

                if (bodyA.isEater && !bodyB.isOguri) {
                    eater = bodyA;
                    food = bodyB;
                } else if (bodyB.isEater && !bodyA.isOguri) {
                    eater = bodyB;
                    food = bodyA;
                }

                if (eater && food) {
                    eatPlush(eater, food);
                }
            });
        });

        Events.on(engine, 'beforeUpdate', () => {
            const now = Date.now();

            for (let i = poppingBodies.length - 1; i >= 0; i--) {
                const body = poppingBodies[i];

                if (body.render.sprite) {
                    body.render.sprite.xScale *= 0.86;
                    body.render.sprite.yScale *= 0.86;
                }
                
                Body.scale(body, 0.86, 0.86);

                if (body.render.sprite && body.render.sprite.xScale < 0.02) {
                    createPopParticles(body.position.x, body.position.y, 6);
                    Composite.remove(engine.world, body);
                    poppingBodies.splice(i, 1);
                }
            }

            const eaters = plushBodies.filter(b => b.isEater && mouseConstraint.body !== b && now > b.eatCooldown);
            const foods = plushBodies.filter(b => !b.isOguri && !b.isEaten);

            eaters.forEach(eater => {
                if (foods.length === 0) return;

                let closestFood = null;
                let minDistance = Infinity;

                foods.forEach(food => {
                    const dist = Math.hypot(food.position.x - eater.position.x, food.position.y - eater.position.y);
                    if (dist < minDistance) {
                        minDistance = dist;
                        closestFood = food;
                    }
                });

                if (closestFood) {
                    const dx = closestFood.position.x - eater.position.x;
                    const dy = closestFood.position.y - eater.position.y;
                    const moveDirection = dx > 0 ? 1 : -1;

                    let newVy = eater.velocity.y;
                    if (dy < -40 && Math.abs(dx) < 180 && Math.abs(eater.velocity.y) < 1.5) {
                        newVy = -5.5;
                    }

                    Body.setVelocity(eater, {
                        x: moveDirection * 5.5,
                        y: newVy
                    });
                }
            });

            const activeOguris = plushBodies.filter(b => b.isOguri);
            if (activeOguris.length > 0) {
                foods.forEach(food => {
                    if (mouseConstraint.body === food) return;

                    let closestOguri = null;
                    let minDistance = Infinity;

                    activeOguris.forEach(oguri => {
                        const dist = Math.hypot(oguri.position.x - food.position.x, oguri.position.y - food.position.y);
                        if (dist < minDistance) {
                            minDistance = dist;
                            closestOguri = oguri;
                        }
                    });

                    if (closestOguri && minDistance < 280) {
                        const dx = food.position.x - closestOguri.position.x;
                        const runDir = dx >= 0 ? 1 : -1;

                        let jumpY = food.velocity.y;
                        if (Math.abs(food.velocity.y) < 1) {
                            jumpY = -2.5 - Math.random() * 2;
                        }

                        Body.setVelocity(food, {
                            x: runDir * (3.5 + Math.random() * 2),
                            y: jumpY
                        });
                    }
                });
            }
        });

        Events.on(render, 'afterRender', () => {
            const context = render.context;
            const textSize = Math.max(16, Math.min(24, window.innerWidth * 0.04));

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                context.save();
                context.globalAlpha = p.life;
                context.fillStyle = p.color;
                context.beginPath();
                context.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                context.fill();
                context.restore();
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.life -= 0.02;

                if (ft.life <= 0) {
                    floatingTexts.splice(i, 1);
                    continue;
                }

                context.save();
                context.globalAlpha = ft.life;
                context.translate(ft.x, ft.y);
                context.rotate(ft.rotation);
                context.font = `700 ${textSize}px Fredoka, sans-serif`;
                context.fillStyle = '#ffa502';
                context.strokeStyle = '#000';
                context.lineWidth = 4;
                context.strokeText(ft.text, 0, 0);
                context.fillText(ft.text, 0, 0);
                context.restore();
            }
        });

        function handlePointerSpawn(clientX, clientY) {
            if (dragEnabled) {
                const clickedBodies = Query.point(plushBodies, { x: clientX, y: clientY });
                if (clickedBodies.length > 0) return;
            }
            spawnPlush(clientX, clientY, true, true);
        }

        window.addEventListener('pointerdown', (event) => {
            if (event.button !== 0) return;
            if (event.target.closest('.button-container') || event.target.closest('#modal-card')) return;
            handlePointerSpawn(event.clientX, event.clientY);
        });

        const autoBtn = document.getElementById('auto-btn');
        autoBtn.addEventListener('click', (e) => {
            e.stopPropagation();

            if (autoDropInterval) {
                clearInterval(autoDropInterval);
                autoDropInterval = null;
                autoBtn.textContent = "Auto Drop: OFF";
                autoBtn.classList.remove('active');
            } else {
                autoDropInterval = setInterval(() => {
                    const randomX = Math.random() * (window.innerWidth - 120) + 60;
                    spawnPlush(randomX, 60, true, false);
                }, 150);

                autoBtn.textContent = "Auto Drop: ON";
                autoBtn.classList.add('active');
            }
        });

        const removeBtn = document.getElementById('remove-btn');
        removeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            mouseConstraint.constraint.body = null;
            Composite.remove(engine.world, plushBodies);
            Composite.remove(engine.world, poppingBodies);
            plushBodies = [];
            poppingBodies = [];
            particles = [];
            floatingTexts = [];
        });

        const explodeBtn = document.getElementById('explode-btn');
        explodeBtn.addEventListener('click', (e) => {
            e.stopPropagation();

            if (plushBodies.length === 0) return;

            mouseConstraint.constraint.body = null;

            if (plushBodies.length >= 120) {
                const victims = [...plushBodies];
                plushBodies = [];

                victims.forEach((plush) => {
                    setTimeout(() => {
                        plush.collisionFilter.mask = 0;
                        
                        Body.setVelocity(plush, {
                            x: (Math.random() - 0.5) * 30,
                            y: -15 - Math.random() * 15
                        });
                        Body.setAngularVelocity(plush, (Math.random() - 0.5) * 1.5);

                        poppingBodies.push(plush);
                    }, Math.random() * 200);
                });

                for (let i = 0; i < 5; i++) {
                    setTimeout(() => playSpawnSFX(), i * 100);
                }

            } else {
                plushBodies.forEach(plush => {
                    const randomAngle = Math.random() * Math.PI * 2;
                    const forceMagnitude = (0.06 + Math.random() * 0.08) * plush.mass;

                    const forceX = Math.cos(randomAngle) * forceMagnitude;
                    const forceY = Math.sin(randomAngle) * forceMagnitude;

                    Body.applyForce(plush, plush.position, { x: forceX, y: forceY });
                });

                playSpawnSFX();
            }
        });

        const dragBtn = document.getElementById('drag-btn');
        dragBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dragEnabled = !dragEnabled;

            mouseConstraint.collisionFilter.mask = dragEnabled ? 0xFFFFFFFF : 0;

            if (dragEnabled) {
                dragBtn.classList.add('active');
            } else {
                dragBtn.classList.remove('active');
                mouseConstraint.constraint.body = null;
            }
        });

        const customBtn = document.getElementById('custom-btn');
        customBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            
            const oguris = plushBodies.filter(b => b.isOguri);
            if (oguris.length === 0) return;

            oguris.forEach(oguri => {
                if (mouseConstraint.body === oguri) {
                    mouseConstraint.constraint.body = null;
                }
                createPopParticles(oguri.position.x, oguri.position.y, 8);
                Composite.remove(engine.world, oguri);
            });

            plushBodies = plushBodies.filter(b => !b.isOguri);
            playSpawnSFX();
        });

        function resizeGame() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            render.options.width = width;
            render.options.height = height;
            render.canvas.width = width * render.options.pixelRatio;
            render.canvas.height = height * render.options.pixelRatio;

            Body.setPosition(floor, { x: width / 2, y: height + 30 });
            Body.setPosition(rightWall, { x: width + 30, y: height / 2 });
            Body.setPosition(leftWall, { x: -30, y: height / 2 });
            Body.setPosition(ceiling, { x: width / 2, y: -30 });
        }

        window.addEventListener('resize', resizeGame);
        window.addEventListener('orientationchange', () => setTimeout(resizeGame, 100));
    </script>
</body>
</html>

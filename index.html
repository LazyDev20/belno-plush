<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Belno Plush Clicker</title>
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #222;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: 'Fredoka', cursive, sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 22px;
            vertical-align: middle;
        }

        .bg-blur {
            position: fixed;
            top: -20px;
            left: -20px;
            width: calc(100% + 40px);
            height: calc(100% + 40px);
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(5px);
            z-index: 0;
            pointer-events: none;
        }

        canvas {
            display: block;
            position: relative;
            z-index: 1;
            touch-action: none;
        }

        .button-container {
            position: fixed;
            top: max(16px, env(safe-area-inset-top));
            left: max(16px, env(safe-area-inset-left));
            right: max(16px, env(safe-area-inset-right));
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 9999;
        }

        .control-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 10px 18px;
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s, background 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-btn:hover {
            background-color: #ff6b81;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
        }

        .icon-btn {
            padding: 10px 12px;
            background-color: #57606f;
        }

        .icon-btn:hover {
            background-color: #747d8c;
        }

        .explode-btn {
            background-color: #ffa502;
        }

        .explode-btn:hover {
            background-color: #eccc68;
        }

        .control-btn.active {
            background-color: #2ed573;
        }

        .control-btn.active:hover {
            background-color: #7bed9f;
        }

        .watermark {
            position: fixed;
            bottom: max(16px, env(safe-area-inset-bottom));
            left: max(16px, env(safe-area-inset-left));
            color: rgba(255, 255, 255, 0.45);
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .watermark img {
            width: 26px;
            height: 26px;
            opacity: 0.6;
            object-fit: contain;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .button-container {
                gap: 6px;
            }

            .control-btn {
                padding: 8px 12px;
                font-size: 13px;
                border-radius: 8px;
            }

            .icon-btn {
                padding: 8px 10px;
            }

            .material-symbols-outlined {
                font-size: 18px;
            }

            .watermark {
                font-size: 16px;
            }

            .watermark img {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-blur"></div>

    <div class="button-container">
        <button id="auto-btn" class="control-btn">Auto Drop: OFF</button>
        <button id="remove-btn" class="control-btn">Remove All</button>
        <button id="explode-btn" class="control-btn explode-btn">Explode!</button>
        <button id="drag-btn" class="control-btn icon-btn" title="Toggle Dragging">
            <span class="material-symbols-outlined">drag_pan</span>
        </button>
    </div>

    <div class="watermark">
        <img src="images/icon.png" alt="icon">
        <span>blinkle.fun</span>
    </div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Mouse, MouseConstraint, Query, Events, Body } = Matter;

        const engine = Engine.create();

        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: 'transparent'
            }
        });

        Render.run(render);

        const runner = Runner.create();
        Runner.run(runner, engine);

        let walls = [];
        function createWalls() {
            if (walls.length > 0) {
                Composite.remove(engine.world, walls);
            }
            const w = window.innerWidth;
            const h = window.innerHeight;
            const wallOptions = { isStatic: true, render: { visible: false } };

            const floor = Bodies.rectangle(w / 2, h + 30, w * 2, 100, wallOptions);
            const leftWall = Bodies.rectangle(-30, h / 2, 100, h * 2, wallOptions);
            const rightWall = Bodies.rectangle(w + 30, h / 2, 100, h * 2, wallOptions);
            const ceiling = Bodies.rectangle(w / 2, -30, w * 2, 100, wallOptions);

            walls = [floor, leftWall, rightWall, ceiling];
            Composite.add(engine.world, walls);
        }
        createWalls();

        const mouse = Mouse.create(render.canvas);
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: {
                stiffness: 0.2,
                render: { visible: false }
            }
        });

        mouseConstraint.collisionFilter.mask = 0;
        Composite.add(engine.world, mouseConstraint);
        render.mouse = mouse;

        let plushBodies = [];
        let poppingBodies = [];
        let particles = [];

        let autoDropInterval = null;
        let isDragging = false;
        let dragEnabled = false;

        const POOL_SIZE = 10;
        const sfxPool = Array.from({ length: POOL_SIZE }, () => {
            const a = new Audio('sfx/sfx.mp3');
            a.volume = 0.8;
            return a;
        });
        let sfxIndex = 0;

        function unlockAudio() {
            sfxPool.forEach(sound => {
                sound.play().then(() => {
                    sound.pause();
                    sound.currentTime = 0;
                }).catch(() => {});
            });
            ['click', 'touchstart', 'pointerdown', 'keydown'].forEach(evt => {
                window.removeEventListener(evt, unlockAudio);
            });
        }

        ['click', 'touchstart', 'pointerdown', 'keydown'].forEach(evt => {
            window.addEventListener(evt, unlockAudio);
        });

        function playSFX() {
            const sound = sfxPool[sfxIndex];
            sound.currentTime = 0;
            sound.play().catch(() => {});
            sfxIndex = (sfxIndex + 1) % POOL_SIZE;
        }

        Events.on(mouseConstraint, 'startdrag', () => { isDragging = true; });
        Events.on(mouseConstraint, 'enddrag', () => {
            setTimeout(() => { isDragging = false; }, 100);
        });

        function getResponsivePlushSize() {
            const minDim = Math.min(window.innerWidth, window.innerHeight);
            if (minDim < 480) return 60;
            if (minDim < 768) return 70;
            return 80;
        }

        function spawnPlush(x, y, playSound = true) {
            const plushSize = getResponsivePlushSize();

            const plush = Bodies.rectangle(x, y, plushSize, plushSize, {
                chamfer: { radius: plushSize * 0.175 },
                restitution: 0.5,
                friction: 0.2,
                frictionStatic: 0.1,
                render: {
                    sprite: {
                        texture: 'images/plush.png',
                        xScale: plushSize / 100,
                        yScale: plushSize / 100
                    }
                }
            });

            Body.setAngularVelocity(plush, (Math.random() - 0.5) * 0.2);
            Body.setVelocity(plush, {
                x: (Math.random() - 0.5) * 2,
                y: 0
            });

            Composite.add(engine.world, plush);
            plushBodies.push(plush);

            if (playSound) playSFX();
        }

        function createPopParticles(x, y) {
            const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#ffffff'];
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 3 + Math.random() * 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1.0
                });
            }
        }

        Events.on(engine, 'beforeUpdate', () => {
            for (let i = poppingBodies.length - 1; i >= 0; i--) {
                const body = poppingBodies[i];

                if (body.render.sprite) {
                    body.render.sprite.xScale *= 0.86;
                    body.render.sprite.yScale *= 0.86;
                }
                
                Body.scale(body, 0.86, 0.86);

                if (body.render.sprite && body.render.sprite.xScale < 0.02) {
                    createPopParticles(body.position.x, body.position.y);
                    Composite.remove(engine.world, body);
                    poppingBodies.splice(i, 1);
                }
            }
        });

        Events.on(render, 'afterRender', () => {
            const context = render.context;
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                context.save();
                context.globalAlpha = p.life;
                context.fillStyle = p.color;
                context.beginPath();
                context.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                context.fill();
                context.restore();
            }
        });

        window.addEventListener('pointerdown', (event) => {
            if (event.target.closest('.button-container')) return;
            if (isDragging) return;
            if (event.button && event.button !== 0) return;

            const clickedBodies = Query.point(plushBodies, { x: event.clientX, y: event.clientY });

            if (clickedBodies.length === 0) {
                spawnPlush(event.clientX, event.clientY, true);
            }
        });

        const autoBtn = document.getElementById('auto-btn');
        autoBtn.addEventListener('click', (e) => {
            e.stopPropagation();

            if (autoDropInterval) {
                clearInterval(autoDropInterval);
                autoDropInterval = null;
                autoBtn.textContent = "Auto Drop: OFF";
                autoBtn.classList.remove('active');
            } else {
                autoDropInterval = setInterval(() => {
                    const randomX = Math.random() * (window.innerWidth - 120) + 60;
                    spawnPlush(randomX, 60, false);
                }, 120);

                autoBtn.textContent = "Auto Drop: ON";
                autoBtn.classList.add('active');
            }
        });

        const removeBtn = document.getElementById('remove-btn');
        removeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            Composite.remove(engine.world, plushBodies);
            Composite.remove(engine.world, poppingBodies);
            plushBodies = [];
            poppingBodies = [];
            particles = [];
        });

        const explodeBtn = document.getElementById('explode-btn');
        explodeBtn.addEventListener('click', (e) => {
            e.stopPropagation();

            if (plushBodies.length === 0) return;

            if (plushBodies.length >= 120) {
                const victims = [...plushBodies];
                plushBodies = [];

                victims.forEach((plush) => {
                    setTimeout(() => {
                        plush.collisionFilter.mask = 0;
                        
                        Body.setVelocity(plush, {
                            x: (Math.random() - 0.5) * 60,
                            y: -25 - Math.random() * 30
                        });
                        Body.setAngularVelocity(plush, (Math.random() - 0.5) * 3.5);

                        poppingBodies.push(plush);
                    }, Math.random() * 200);
                });

                for (let i = 0; i < 8; i++) {
                    setTimeout(() => playSFX(), i * 40);
                }

            } else {
                plushBodies.forEach(plush => {
                    const randomAngle = Math.random() * Math.PI * 2;
                    const forceMagnitude = (0.12 + Math.random() * 0.18) * plush.mass;

                    const forceX = Math.cos(randomAngle) * forceMagnitude;
                    const forceY = Math.sin(randomAngle) * forceMagnitude;

                    Body.applyForce(plush, plush.position, { x: forceX, y: forceY });
                });

                playSFX();
            }
        });

        const dragBtn = document.getElementById('drag-btn');
        dragBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dragEnabled = !dragEnabled;

            mouseConstraint.collisionFilter.mask = dragEnabled ? 0xFFFFFFFF : 0;

            if (dragEnabled) {
                dragBtn.classList.add('active');
            } else {
                dragBtn.classList.remove('active');
            }
        });

        window.addEventListener('resize', () => {
            render.options.width = window.innerWidth;
            render.options.height = window.innerHeight;
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;

            createWalls();
        });
    </script>
</body>
</html>
